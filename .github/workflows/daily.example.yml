# Saves the day's Krillion answer sheet and republishes krillionanswerkey.com.
# The Daily Dive turns over at midnight US Eastern: 05:00 UTC in winter, 04:00 UTC in summer. Scheduled
# runs can start late, so there are several; a run that finds the day already saved does nothing.
name: krillion daily

on:
  schedule:
    - cron: "3,18,40 4,5 * * *"
    - cron: "20 6,9 * * *"
  workflow_dispatch:

concurrency: krillion-daily

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Probe (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/krillion-fetch.mjs --probe
      - name: Fetch today's sheet
        id: fetch
        run: |
          node scripts/krillion-fetch.mjs || echo "fetch did not succeed; nothing to publish"
          if git diff --quiet -- src/sites/krillion/data/days.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the day
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sites/krillion/data/days.json
          git commit -m "Krillion: $(node -p "require('./src/sites/krillion/data/days.json').at(-1).date")"
          git push
      - name: Build and deploy
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npm run deploy:krillion
